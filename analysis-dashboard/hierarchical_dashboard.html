<style>




/* ===== Reset & Base ===== */




*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }




body {




  font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;




  background: var(--bg-primary);




  color: var(--text-primary);




  line-height: 1.6;




  -webkit-font-smoothing: antialiased;




}









/* ===== Header ===== */




.app-header {




  background: var(--da-red);




  padding: 1.25rem 2rem;




  position: sticky; top: 0; z-index: 100;




  box-shadow: 0 2px 8px rgba(140,21,21,0.3);




}




.header-content { max-width: 1400px; margin: 0 auto; }




.header-content h1 { font-size: 1.5rem; font-weight: 700; color: #fff; letter-spacing: -0.025em; }




.header-subtitle { font-size: 0.8125rem; color: var(--da-gold-light); margin-top: 0.125rem; font-weight: 500; }









/* ===== Main layout ===== */




.app-main { max-width: 1400px; margin: 0 auto; padding: 1.5rem 2rem 3rem; }









/* ===== Breadcrumb ===== */




.breadcrumb { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; margin-bottom: 1.25rem; font-size: 0.8rem; }




.crumb { cursor: pointer; padding: 0.3rem 0.6rem; border-radius: 6px; color: var(--da-red); font-weight: 500; transition: background 0.15s; }




.crumb:hover { background: var(--da-red-lighter); }




.crumb.active { background: var(--da-red); color: #fff; cursor: default; font-weight: 600; }




.crumb-sep { color: var(--text-muted); font-size: 0.7rem; }









/* ===== Stat cards ===== */




.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1rem; margin-bottom: 1.5rem; }




.stat-card { background: var(--bg-white); border-radius: var(--radius-lg); padding: 1.25rem; text-align: center; box-shadow: var(--shadow-sm); border: 1px solid var(--border-color); }




.stat-card .value { font-size: 2rem; font-weight: 700; color: var(--da-red); }




.stat-card .label { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }




</style>




<style>




/* ===== Cards ===== */




.card-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1rem; }




.card {




  background: var(--bg-white);




  border: 1px solid var(--border-color);




  border-left: 4px solid var(--da-red);




  border-radius: var(--radius);




  padding: 1.25rem;




  cursor: pointer;




  transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;




}




.card:hover { transform: translateY(-2px); box-shadow: var(--shadow-md); border-left-color: var(--da-gold); }




.card h3 { font-size: 0.95rem; font-weight: 600; color: var(--da-red-dark); margin-bottom: 0.4rem; line-height: 1.4; }




.card .meta { font-size: 0.8rem; color: var(--text-secondary); }




.card .badge {




  display: inline-block; font-size: 0.7rem; font-weight: 600;




  padding: 0.15rem 0.5rem; border-radius: 4px; margin-right: 0.4rem;




  background: var(--da-red); color: #fff;




}




.card .badge-gold { background: var(--da-gold); }









/* ===== Section panels ===== */




.section-panel {




  background: var(--bg-white);




  border: 1px solid var(--border-color);




  border-radius: var(--radius-lg);




  padding: 1.5rem;




  margin-bottom: 1.25rem;




  box-shadow: var(--shadow-sm);




}




.section-panel h2 {




  font-size: 1.05rem; font-weight: 700;




  color: var(--da-red-dark); margin-bottom: 0.75rem;




  padding-bottom: 0.5rem;




  border-bottom: 2px solid var(--da-gold);




}




.section-panel h4 {




  font-size: 0.8rem; font-weight: 700; color: var(--da-red);




  text-transform: uppercase; letter-spacing: 0.04em;




  margin: 0.75rem 0 0.35rem;




}









/* ===== Bar charts ===== */




.bar-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.6rem; font-size: 0.8rem; }




.bar-label { width: 90px; text-align: right; color: var(--text-secondary); flex-shrink: 0; font-weight: 500; }




.bar-track { flex: 1; height: 22px; background: var(--bg-primary); border-radius: 4px; overflow: hidden; border: 1px solid var(--border-color); }




.bar-fill { height: 100%; border-radius: 3px; transition: width 0.4s ease; }




.bar-value { width: 60px; color: var(--text-secondary); font-size: 0.75rem; font-weight: 600; }




</style>




<style>




/* ===== Tables ===== */




.data-table { width: 100%; border-collapse: collapse; font-size: 0.8rem; }




.data-table th, .data-table td { text-align: left; padding: 0.6rem 0.75rem; border-bottom: 1px solid var(--border-color); }




.data-table th { background: var(--bg-primary); font-weight: 600; color: var(--da-red-dark); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em; }




.data-table tr:hover { background: var(--bg-hover); }




.data-table .clickable { cursor: pointer; color: var(--da-red); font-weight: 500; }




.data-table .clickable:hover { text-decoration: underline; }









/* ===== Quarter timeline ===== */




.quarter-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; }




.quarter-block {




  background: var(--bg-primary); border: 1px solid var(--border-color);




  border-radius: var(--radius); padding: 0.75rem; min-height: 60px; cursor: pointer;




  transition: border-color 0.15s, box-shadow 0.15s;




}




.quarter-block:hover { border-color: var(--da-gold); box-shadow: var(--shadow-sm); }




.quarter-block h5 {




  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.05em;




  color: var(--da-red-dark); margin-bottom: 0.5rem;




  padding-bottom: 0.25rem; border-bottom: 2px solid var(--da-gold);




  font-weight: 700;




}




.quarter-block .course-item {




  font-size: 0.75rem; color: var(--text-primary);




  padding: 0.2rem 0.5rem; margin-bottom: 0.2rem;




  background: var(--bg-white); border-radius: 4px;




  border-left: 3px solid var(--da-red);




}




.quarter-block .course-item.additional { border-left-color: var(--da-gold); color: var(--text-secondary); font-style: italic; }




.quarter-block.empty { opacity: 0.4; }









/* ===== Conflict pills ===== */




.conflict-pill {




  display: inline-flex; align-items: center; gap: 0.25rem;




  background: var(--da-red-lighter); border: 1px solid rgba(140,21,21,0.2);




  border-radius: 6px; padding: 0.3rem 0.65rem;




  font-size: 0.75rem; color: var(--da-red-dark); font-weight: 500;




  margin: 0.25rem 0.25rem 0.25rem 0;

.conflict-pill.intra { background: var(--da-gold-lighter); border-color: rgba(196,154,26,0.3); color: var(--da-gold-dark); }









/* ===== Responsive ===== */




@media (max-width: 768px) {




  .app-header { padding: 1rem; }

  .card-grid { grid-template-columns: 1fr; }




  .quarter-grid { grid-template-columns: 1fr; }




  .bar-label { width: 55px; font-size: 0.7rem; }




}

const TERMS = {




  "202622": { label: "Fall 2025", year: "year_1", quarter: "fall" },




  "202632": { label: "Winter 2026", year: "year_1", quarter: "winter" },




  "202642": { label: "Spring 2026", year: "year_1", quarter: "spring" },




  "202722": { label: "Fall 2026", year: "year_2", quarter: "fall" },




  "202732": { label: "Winter 2027", year: "year_2", quarter: "winter" },




  "202742": { label: "Spring 2027", year: "year_2", quarter: "spring" },




};









// ============================================================




// DATA TRANSFORMATION




// ============================================================




const subjectToDivision = {};




CONFLICT_DATA.departments.forEach(d => {




  subjectToDivision[d.subject] = { code: d.division_code, label: d.division_label };




});









function derivePrimarySubject(name) {




  const m1 = name.match(/^([A-Z]{2,5})[\s:]/);




  if (m1 && subjectToDivision[m1[1]]) return m1[1];




  if (/communication studies/i.test(name)) return "COMM";




  if (/journalism/i.test(name)) return "JOUR";




  const map = {




    "Chemistry":"CHEM","Biology":"BIOL","Physics":"PHYS","Math":"MATH",




    "Music":"MUSI","Economics":"ECON","English":"ENGL","Psychology":"PSYC",




    "Nursing":"NURS","Nurse":"NURS","Automotive":"AUTO","Computer Science":"CIS",




    "Photography":"PHTG","Accounting":"ACCT","Business":"BUS","Anthropology":"ANTH",




    "Dance":"DANC","Theater":"THEA","Astronomy":"ASTR","Engineering":"ENGR",




    "Meteorology":"MET","Environmental":"ESCI","Geology":"GEOL",




  };




  for (const [word, subj] of Object.entries(map)) { if (name.includes(word)) return subj; }




  if (/\bESL\b/.test(name) || /English as a Second/i.test(name)) return "ESL";




  return null;




}









const pathways = PATHWAY_DATA.map(p => {




  const id = `${p.source_file}#${p.page_number}`;




  const primarySubject = derivePrimarySubject(p.program_name);




  const divInfo = primarySubject ? subjectToDivision[primarySubject] : null;




  return { id, primarySubject, areaCode: divInfo?.code || null,




    programName: p.program_name, credentialType: p.credential_type,




    village: p.village, years: p.years, notes: p.additional_notes || [] };




});









const pathwaysBySubject = {};




pathways.forEach(p => { if (p.primarySubject) { (pathwaysBySubject[p.primarySubject] ||= []).push(p); } });









const pairsBySubject = {};




CONFLICT_DATA.pairs.forEach(pair => {




  [pair.subject_a, pair.subject_b].forEach(s => { (pairsBySubject[s] ||= []).push(pair); });




});









// ============================================================




// RENDERING ENGINE




// ============================================================




const $content = document.getElementById('content');




const $stats = document.getElementById('stats-row');




const $breadcrumb = document.getElementById('breadcrumb');




let navStack = [{ level: 'overview' }];









function navigate(state) { navStack.push(state); render(); }




function navigateTo(i) { navStack = navStack.slice(0, i + 1); render(); }









function render() {




  const state = navStack[navStack.length - 1];




  renderBreadcrumb();




  switch (state.level) {




    case 'overview': renderOverview(); break;




    case 'area': renderArea(state.code); break;




    case 'department': renderDepartment(state.subject); break;




    case 'pathway': renderPathway(state.id); break;




    case 'quarter': renderQuarter(state.pathwayId, state.yearKey, state.quarterKey); break;




    default: renderOverview();




  }




  window.scrollTo({ top: 0, behavior: 'smooth' });




}









function renderBreadcrumb() {




  const labels = navStack.map((s) => {




    switch (s.level) {




      case 'overview': return 'Overview';




      case 'area': return CONFLICT_DATA.divisions.find(d => d.division_code === s.code)?.division_label || s.code;




      case 'department': return s.subject;




      case 'pathway': { const p = pathways.find(x => x.id === s.id); return p ? p.programName.slice(0,35) + (p.programName.length > 35 ? '...' : '') : s.id; }




      case 'quarter': return `${s.yearKey === 'year_1' ? 'Year 1' : 'Year 2'}  -  ${s.quarterKey.charAt(0).toUpperCase() + s.quarterKey.slice(1)}`;




      default: return '?';




    }




  });




  $breadcrumb.innerHTML = labels.map((label, i) => {




    const isLast = i === labels.length - 1;




    const sep = i > 0 ? '<span class="crumb-sep">></span>' : '';




    return `${sep}<span class="crumb ${isLast ? 'active' : ''}" onclick="navigateTo(${i})">${label}</span>`;




  }).join('');




}









function statCard(value, label) {




  const display = typeof value === 'number' ? value.toLocaleString() : value;




  return `<div class="stat-card"><div class="value">${display}</div><div class="label">${label}</div></div>`;




}









function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }




function termFor(yk, qk) { return { 'year_1#fall':'202622','year_1#winter':'202632','year_1#spring':'202642','year_2#fall':'202722','year_2#winter':'202732','year_2#spring':'202742' }[`${yk}#${qk}`] || ''; }









// --- Bar chart helper (De Anza red/gold gradient) ---




function renderBars(items, labelFn, valueFn, maxVal) {




  if (!maxVal) maxVal = Math.max(...items.map(valueFn));




  return items.map((item, i) => {




    const pct = (valueFn(item) / maxVal * 100).toFixed(1);




    // Gradient from red to gold across bars




    const ratio = i / Math.max(items.length - 1, 1);




    const color = ratio < 0.5




      ? `color-mix(in srgb, var(--da-red) ${100 - ratio*100}%, var(--da-red-light))`




      : `color-mix(in srgb, var(--da-gold-dark) ${(ratio-0.5)*100}%, var(--da-red-light))`;




    return `<div class="bar-row">




      <span class="bar-label">${labelFn(item)}</span>




      <div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:var(--da-red);opacity:${1 - ratio*0.4}"></div></div>




      <span class="bar-value">${valueFn(item).toLocaleString()}</span>




    </div>`;




  }).join('');




}









// --- LEVEL 0: Overview ---




function renderOverview() {




  $stats.innerHTML = [




    statCard(CONFLICT_DATA.total_conflict_pairs, 'Total Conflict Pairs'),




    statCard(CONFLICT_DATA.pathway_quarters_analyzed, 'Pathway-Quarters Analyzed'),




    statCard(CONFLICT_DATA.divisions.length, 'Academic Areas'),




    statCard(CONFLICT_DATA.departments.length, 'Departments Involved'),




  ].join('');









  const divCards = CONFLICT_DATA.divisions




    .sort((a, b) => b.conflict_appearances - a.conflict_appearances)




    .map(div => `




      <div class="card" onclick="navigate({level:'area',code:'${div.division_code}'})">




        <h3>${div.division_label}</h3>




        <div class="meta">




          <span class="badge">${div.division_code}</span>




          <span class="badge badge-gold">${div.subject_count} depts</span>




          ${div.conflict_appearances.toLocaleString()} conflict appearances




        </div>




      </div>`).join('');









  const topPairs = CONFLICT_DATA.pairs.filter(p => !p.is_intra_department).slice(0, 10);




  const termBars = renderBars(
    CONFLICT_DATA.terms, t => TERM_OPTIONS[t.term_code] || t.term_code,
    t => t.total_conflicts
  );









  $content.innerHTML = `




    <div class="section-panel"><h2>Academic Areas</h2><p style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:1rem;">Click an area to see its departments and conflict hotspots.</p><div class="card-grid">${divCards}</div></div>




    <div class="section-panel"><h2>Top Cross-Department Conflict Pairs</h2>${renderBars(topPairs, p => p.subject_a + ' vs ' + p.subject_b, p => p.conflict_count)}</div>




    <div class="section-panel"><h2>Conflicts by Term</h2>${termBars}</div>




  `;




}









// --- LEVEL 1: Academic Area ---




function renderArea(code) {




  const div = CONFLICT_DATA.divisions.find(d => d.division_code === code);




  if (!div) { renderOverview(); return; }




  const depts = CONFLICT_DATA.departments.filter(d => d.division_code === code)




    .sort((a, b) => b.conflict_appearances - a.conflict_appearances);









  $stats.innerHTML = [




    statCard(div.conflict_appearances, 'Conflicts in Area'),




    statCard(div.subject_count, 'Departments'),




    statCard(depts.reduce((s, d) => s + d.pathway_count, 0), 'Pathways Affected'),




  ].join('');









  const deptCards = depts.map(d => `




    <div class="card" onclick="navigate({level:'department',subject:'${d.subject}'})">




      <h3>${d.subject}</h3>




      <div class="meta">${d.conflict_appearances.toLocaleString()} conflicts  -  ${d.pathway_count} pathways affected</div>




    </div>`).join('');









  const areaSubjects = new Set(div.subjects);




  const areaPairs = CONFLICT_DATA.pairs




    .filter(p => areaSubjects.has(p.subject_a) || areaSubjects.has(p.subject_b))




    .slice(0, 12);









  $content.innerHTML = `




    <div class="section-panel"><h2>Departments in ${div.division_label}</h2><div class="card-grid">${deptCards}</div></div>




    <div class="section-panel"><h2>Top Conflict Pairs Involving This Area</h2>${renderBars(areaPairs, p => p.subject_a + ' vs ' + p.subject_b, p => p.conflict_count)}</div>




  `;




}









// --- LEVEL 2: Department ---




function renderDepartment(subject) {




  const dept = CONFLICT_DATA.departments.find(d => d.subject === subject);




  if (!dept) { renderOverview(); return; }




  const divInfo = subjectToDivision[subject] || {};




  const pairs = (pairsBySubject[subject] || []).sort((a, b) => b.conflict_count - a.conflict_count).slice(0, 15);




  const deptPathways = pathwaysBySubject[subject] || [];









  $stats.innerHTML = [




    statCard(dept.conflict_appearances, 'Conflict Appearances'),




    statCard(dept.pathway_count, 'Pathways Affected'),




    statCard(pairs.length, 'Conflict Partners'),




  ].join('');









  // Term breakdown




  const termRows = CONFLICT_DATA.terms.map(t => {




    const entry = t.top_subjects.find(s => s.subject === subject);




    return entry ? `<tr><td>${TERMS[t.term_code]?.label || t.term_code}</td><td>${entry.count.toLocaleString()}</td></tr>` : '';




  }).filter(Boolean).join('');









  const pwCards = deptPathways.map(p => `




    <div class="card" onclick="navigate({level:'pathway',id:'${p.id}'})">




      <h3>${p.programName.slice(0,55)}${p.programName.length > 55 ? '...' : ''}</h3>




      <div class="meta"><span class="badge badge-gold">${p.credentialType.split('(')[0].trim()}</span>${p.village}</div>




    </div>`).join('');









  $content.innerHTML = `




    <div class="section-panel">




      <h2>${subject}  -  Conflict Partners</h2>




      <p style="font-size:0.8rem;color:var(--text-secondary);margin-bottom:0.75rem;">Division: ${divInfo.label || '?'} (${divInfo.code || '?'})</p>




      ${renderBars(pairs, p => (p.subject_a === subject ? p.subject_b : p.subject_a) + (p.is_intra_department ? ' (self)' : ''), p => p.conflict_count)}




    </div>




    <div class="section-panel">




      <h2>Conflicts by Term</h2>




      ${termRows ? `<table class="data-table"><thead><tr><th>Term</th><th>Count</th></tr></thead><tbody>${termRows}</tbody></table>` : '<p style="color:var(--text-muted);font-size:0.8rem;">Not in top 15 subjects for any term.</p>'}




    </div>




    <div class="section-panel">




      <h2>Pathways (Primary Subject: ${subject})</h2>




      ${deptPathways.length > 0 ? `<div class="card-grid">${pwCards}</div>` : '<p style="color:var(--text-muted);font-size:0.8rem;">No pathways in the embedded subset match this subject. Full dataset (238 pathways) would show matches.</p>'}




    </div>




  `;




}









// --- LEVEL 3: Pathway ---




function renderPathway(id) {




  const pw = pathways.find(p => p.id === id);




  if (!pw) { renderOverview(); return; }









  $stats.innerHTML = [




    statCard(pw.primarySubject || ' - ', 'Primary Dept'),




    statCard(pw.credentialType.split('(')[0].trim(), 'Credential'),




    statCard(pw.village.split(' and ')[0], 'Village'),




  ].join('');









  // Year/quarter timeline




  const yearHtml = ['year_1', 'year_2'].map(yk => {




    const yearData = pw.years[yk];




    const hasCourses = ['fall','winter','spring'].some(q =>




      yearData[q].required_courses.length > 0 || yearData[q].additional_courses.length > 0);




    if (!hasCourses) return '';




    const quarters = ['fall','winter','spring'].map(qk => {




      const q = yearData[qk];




      const hasContent = q.required_courses.length > 0 || q.additional_courses.length > 0;




      if (!hasContent) return `<div class="quarter-block empty"><h5>${qk}</h5><span style="font-size:0.7rem;color:var(--text-muted);"> - </span></div>`;




      const tc = termFor(yk, qk);




      const courses = q.required_courses.slice(0, 6).map(c => `<div class="course-item">${escHtml(c)}</div>`).join('');




      const more = q.required_courses.length > 6 ? `<div style="font-size:0.7rem;color:var(--text-muted);padding:0.15rem 0.5rem;">+ ${q.required_courses.length - 6} more...</div>` : '';




      const additional = q.additional_courses.slice(0, 3).map(c => `<div class="course-item additional">${escHtml(c)}</div>`).join('');




      return `<div class="quarter-block" onclick="navigate({level:'quarter',pathwayId:'${id}',yearKey:'${yk}',quarterKey:'${qk}'})">




        <h5>${qk} ${TERMS[tc]?.label ? ' -  ' + TERMS[tc].label : ''}</h5>




        ${courses}${more}${additional}




      </div>`;




    }).join('');




    return `<div style="margin-bottom:1.25rem;"><h4>${yk === 'year_1' ? 'First Year' : 'Second Year'}</h4><div class="quarter-grid">${quarters}</div></div>`;




  }).join('');









  // Conflict pills for this subject




  const subjectPairs = pw.primarySubject ? (pairsBySubject[pw.primarySubject] || []).slice(0, 10) : [];




  const pillsHtml = subjectPairs.map(p =>




    `<span class="conflict-pill ${p.is_intra_department ? 'intra' : ''}">${p.subject_a} vs ${p.subject_b}  -  ${p.conflict_count}</span>`




  ).join('');

        ${pw.credentialType}  -  ${pw.village}  -  Primary dept: <strong>${pw.primarySubject || 'unknown'}</strong>




      </p>




      ${pillsHtml ? `<h4>Known Conflict Pairs (${pw.primarySubject} dept)</h4><div style="margin-bottom:0.5rem;">${pillsHtml}</div>` : ''}




    </div>




    <div class="section-panel">




      <h2>Course Plan  -  click a quarter to expand</h2>




      ${yearHtml}




    </div>




    ${pw.notes.length > 0 ? `<div class="section-panel"><h2>Program Notes</h2><ul style="padding-left:1.25rem;font-size:0.8rem;color:var(--text-secondary);list-style:disc;">${pw.notes.map(n => `<li style="margin-bottom:0.3rem;">${escHtml(n)}</li>`).join('')}</ul></div>` : ''}




  `;




}









// --- LEVEL 4: Quarter detail ---




function renderQuarter(pathwayId, yearKey, quarterKey) {




  const pw = pathways.find(p => p.id === pathwayId);




  if (!pw) { renderOverview(); return; }




  const q = pw.years[yearKey]?.[quarterKey];




  if (!q) { renderPathway(pathwayId); return; }




  const term = termFor(yearKey, quarterKey);




  const termLabel = TERMS[term]?.label || term;









  // Extract course codes from raw text




  const coursePattern = /\b([A-Z]{2,5})\s+[A-Z]?\d{1,4}[A-Z]{0,3}\b/g;




  function extractCourses(text) {




    const matches = []; let m;




    while ((m = coursePattern.exec(text)) !== null) matches.push(m[0]);




    coursePattern.lastIndex = 0;




    return matches;




  }




  const allText = [...q.required_courses, ...q.additional_courses];




  const extracted = allText.flatMap(extractCourses);




  const uniqueSubjects = [...new Set(extracted.map(c => c.split(' ')[0]))];









  // Find which stored conflict pairs could apply here




  const relevantPairs = [];




  for (let i = 0; i < uniqueSubjects.length; i++) {




    for (let j = i + 1; j < uniqueSubjects.length; j++) {




      const pair = CONFLICT_DATA.pairs.find(p =>




        (p.subject_a === uniqueSubjects[i] && p.subject_b === uniqueSubjects[j]) ||




        (p.subject_a === uniqueSubjects[j] && p.subject_b === uniqueSubjects[i]));




      if (pair) relevantPairs.push(pair);




    }




    // Also check intra-department pairs




    const intraPair = CONFLICT_DATA.pairs.find(p =>




      p.subject_a === uniqueSubjects[i] && p.subject_b === uniqueSubjects[i]);




    if (intraPair && extracted.filter(c => c.startsWith(uniqueSubjects[i] + ' ')).length > 1) {




      relevantPairs.push(intraPair);




    }




  }









  $stats.innerHTML = [




    statCard(termLabel, 'Term'),




    statCard(q.required_courses.length, 'Course Entries'),




    statCard(extracted.length, 'Codes Detected'),




    statCard(relevantPairs.length, 'Potential Conflicts'),




  ].join('');









  const courseList = q.required_courses.map(c => `<div class="course-item">${escHtml(c)}</div>`).join('');




  const addlList = q.additional_courses.map(c => `<div class="course-item additional">${escHtml(c)}</div>`).join('');









  const pairsHtml = relevantPairs.length > 0




    ? relevantPairs.map(p => `<span class="conflict-pill ${p.is_intra_department ? 'intra' : ''}">${p.subject_a} vs ${p.subject_b}  -  ${p.conflict_count} total</span>`).join('')




    : '<p style="font-size:0.8rem;color:var(--text-muted);">No known conflict pairs for the detected subjects in this quarter.</p>';









  $content.innerHTML = `




    <div class="section-panel">




      <h2>${pw.programName.slice(0,50)}...  -  ${yearKey === 'year_1' ? 'Year 1' : 'Year 2'}, ${quarterKey.charAt(0).toUpperCase() + quarterKey.slice(1)} (${termLabel})</h2>




    </div>




    <div class="section-panel">




      <h2>Required Courses</h2>




      ${courseList || '<p style="color:var(--text-muted);font-size:0.8rem;">None listed for this quarter.</p>'}




      ${addlList ? `<h4 style="margin-top:0.75rem;">Additional / Elective</h4>${addlList}` : ''}




    </div>




    <div class="section-panel">




      <h2>Detected Course Codes</h2>




      <p style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem;">Extracted from raw text above (heuristic  -  may include false positives from prose).</p>




      <div style="display:flex;flex-wrap:wrap;gap:0.3rem;">




        ${extracted.length > 0 ? extracted.map(c => `<span class="badge">${c}</span>`).join('') : '<span style="font-size:0.8rem;color:var(--text-muted);">No course codes detected.</span>'}




      </div>




    </div>




    <div class="section-panel">




      <h2>Potential Scheduling Conflicts</h2>




      <p style="font-size:0.75rem;color:var(--text-muted);margin-bottom:0.5rem;">Based on aggregate subject-pair data across all terms. Section-level detail (specific CRN/time) requires a DynamoDB export.</p>




      ${pairsHtml}




    </div>




  `;




}









// --- Initialize ---




render();




</script>

// Parse time string "09:30 am-10:20 am" -> {start: minutes, end: minutes}




function parseTime(str) {




  if (!str) return null;




  const m = str.match(/(\d{1,2}):(\d{2})\s*([ap]m)\s*-\s*(\d{1,2}):(\d{2})\s*([ap]m)/i);




  if (!m) return null;




  function toMin(h, min, mer) {




    h = parseInt(h) % 12;




    if (mer.toLowerCase() === 'pm') h += 12;




    return h * 60 + parseInt(min);




  }




  const start = toMin(m[1], m[2], m[3]);




  const end = toMin(m[4], m[5], m[6]);




  return end > start ? { start, end } : null;




}









// Parse days string "MW" -> ['M','W']




function parseDays(str) {




  if (!str) return [];




  return [...str.toUpperCase()].filter(c => 'MTWRF'.includes(c));




}









// Normalize course number (same logic as normalization.py)




function normNum(raw) {




  let s = (raw || '').trim().toUpperCase().replace(/\.$/, '');




  const m = s.match(/^([A-Z]?)(\d{1,4})([A-Z]{0,3})$/);




  if (!m) return s;




  let [, prefix, digits, suffix] = m;




  if (prefix === 'D') prefix = '';




  digits = digits.replace(/^0+/, '') || '0';




  return prefix + digits + suffix;




}

// Check if two time blocks overlap (strict: back-to-back is fine)
function timesOverlap(a, b) {
  return a.start < b.end && b.start < a.end;
}

// Check if two meetings share a day AND time overlap
function meetingsConflict(mA, mB) {
  if (!mA.time || !mB.time) return false;
  const sharedDays = mA.days.filter(d => mB.days.includes(d));
  if (sharedDays.length === 0) return false;
  return timesOverlap(mA.time, mB.time);
}

// ============================================================
// COURSE-TO-COURSE ANALYSIS
// ============================================================
// Compare all sections of anchor course against all sections of compare course.
// Produces a matrix: for each (anchor section, compare section) pair, determine
// if they conflict. Then summarize: how many compare sections does each anchor
// section block? How many anchor sections does each compare section conflict with?
function analyzeCourseVsCourse(anchorSections, compareSections) {
  // Group by CRN to get unique sections
  function uniqueByCrn(rows) {
    const map = {};
    rows.forEach(r => {
      if (!map[r.crn]) map[r.crn] = { ...r, allMeetings: [] };
      map[r.crn].allMeetings.push(r);
    });
    return Object.values(map);
  }

  const anchorUnique = uniqueByCrn(anchorSections);
  const compareUnique = uniqueByCrn(compareSections);

  // Build the pair matrix: matrix[i][j] = true if anchor[i] conflicts with compare[j]
  const matrix = anchorUnique.map(aSec => {
    return compareUnique.map(cSec => {
      // Conflict if ANY meeting of anchor overlaps ANY meeting of compare
      return aSec.allMeetings.some(am =>
        cSec.allMeetings.some(cm => meetingsConflict(am, cm))
      );
    });
  });

  // Per-anchor-section: how many compare sections it blocks
  const anchorBlockCounts = matrix.map(row => row.filter(Boolean).length);

  // Per-compare-section: how many anchor sections it conflicts with
  const compareBlockCounts = compareUnique.map((_, j) =>
    matrix.reduce((sum, row) => sum + (row[j] ? 1 : 0), 0)
  );

  // Overall course-level summary
  const totalPairs = anchorUnique.length * compareUnique.length;
  const conflictingPairs = matrix.flat().filter(Boolean).length;
  const pctConflict = totalPairs > 0 ? Math.round(100 * conflictingPairs / totalPairs) : 0;

  // Can a student find at least one non-conflicting combination?
  // For each anchor section, is there at least one free compare section?
  const anchorHasFreeOption = matrix.map(row => row.some(v => !v));
  const allAnchorsFree = anchorHasFreeOption.every(Boolean);
  const noAnchorsFree = anchorHasFreeOption.every(v => !v);

  // Compare side: which sections are conflict-free against ALL anchor sections?
  const compareFullyFree = compareUnique.map((_, j) =>
    matrix.every(row => !row[j])
  );
  const freeCompareCount = compareFullyFree.filter(Boolean).length;

  let constraintLevel, constraintLabel;
  if (totalPairs === 0) {
    constraintLevel = 'none'; constraintLabel = 'No sections to compare';
  } else if (conflictingPairs === 0) {
    constraintLevel = 'clear'; constraintLabel = 'No overlaps - all combinations work';
  } else if (noAnchorsFree) {
    constraintLevel = 'blocked'; constraintLabel = 'Every combination has a conflict - courses cannot be co-enrolled';
  } else if (allAnchorsFree && freeCompareCount <= 1) {
    constraintLevel = 'limited'; constraintLabel = `Options exist but tight - only ${freeCompareCount} comparison section(s) avoid all conflicts`;
  } else if (pctConflict > 60) {
    constraintLevel = 'constrained'; constraintLabel = `${pctConflict}% of section pairs conflict - limited flexibility`;
  } else {
    constraintLevel = 'partial'; constraintLabel = `${conflictingPairs} of ${totalPairs} section pairs conflict (${pctConflict}%) - reasonable flexibility`;
  }

  return {
    anchorUnique, compareUnique, matrix,
    anchorBlockCounts, compareBlockCounts,
    totalPairs, conflictingPairs, pctConflict,
    anchorHasFreeOption, compareFullyFree, freeCompareCount,
    constraintLevel, constraintLabel,
  };
}

  function uniqueByCrn(rows) {

      map[r.crn].allMeetings.push(r);

  }

  const compareUnique = uniqueByCrn(compareSections);
  const analyzed = compareUnique.map(sec => {
    const overlaps = sec.allMeetings.some(cm =>
      anchorMeetings.some(am => meetingsConflict(am, cm))
    );
    return { ...sec, overlaps };
  });

  const totalSections = analyzed.length;
  const overlappingCount = analyzed.filter(s => s.overlaps).length;
  const freeCount = totalSections - overlappingCount;

  let constraintLevel, constraintLabel;
  if (totalSections === 0) {
    constraintLevel = 'none'; constraintLabel = 'No sections available';
  } else if (freeCount === 0) {
    constraintLevel = 'blocked'; constraintLabel = 'All sections overlap - no available option';
  } else if (freeCount === 1) {
    constraintLevel = 'limited'; constraintLabel = 'Only 1 non-overlapping section available';
  } else if (overlappingCount === 0) {
    constraintLevel = 'clear'; constraintLabel = 'No overlaps - full flexibility';
  } else {
    constraintLevel = 'partial'; constraintLabel = `${freeCount} of ${totalSections} sections available (${overlappingCount} overlap)`;
  }

  return { analyzed, totalSections, overlappingCount, freeCount, constraintLevel, constraintLabel };
}

// Inject the scheduler launcher into the existing overview
// Compute conflict counts for historic terms using schedule data
function computeTermConflicts(termCode) {
  const termIndex = schedIndexes[termCode];
  if (!termIndex) return 0;
  const bySubject = termIndex.bySubject;
  const byCourse = {};
  Object.values(bySubject).forEach(rows => {
    rows.forEach(r => { (byCourse[r.course] ||= []).push(r); });
  });
  const courses = Object.keys(byCourse);
  let conflictCount = 0;
  for (let i = 0; i < courses.length; i++) {
    for (let j = i + 1; j < courses.length; j++) {
      const secsA = byCourse[courses[i]];
      const secsB = byCourse[courses[j]];
      for (const a of secsA) {
        for (const b of secsB) {
          if (a.days.some(d => b.days.includes(d)) && timesOverlap(a.time, b.time)) {
            conflictCount++;
          }
        }
      }
    }
  }
  return conflictCount;
}

function buildAllTermConflicts() {
  const result = [];
  const allTerms = Object.keys(TERM_OPTIONS).sort();
  const precomputed = {};
  CONFLICT_DATA.terms.forEach(t => { precomputed[t.term_code] = t.total_conflicts; });
  allTerms.forEach(tc => {
    let conflicts;
    if (precomputed[tc] !== undefined) {
      conflicts = precomputed[tc];
    } else if (schedIndexes[tc]) {
      conflicts = computeTermConflicts(tc);
    } else {
      return;
    }
    result.push({ term_code: tc, label: TERM_OPTIONS[tc] || tc, total_conflicts: conflicts });
  });
  return result;
}

  html += `<th style="min-width:90px;">${schedState.anchorCourse} \\ ${schedState.compareCourse}</th>`;

  });

  html += `<tr style="border-top:2px solid var(--da-gold);"><td style="font-weight:700;">Conflicts with:</td>`;
  compareUnique.forEach((_, j) => {
    const blocked = compareBlockCounts[j];

  });
  html += `<td></td></tr>`;
  html += `</tbody></table></div></div>`;

  // --- Feasibility Summary ---
  html += `<div class="section-panel"><h2>Feasibility Summary</h2>`;
  html += `<table class="data-table"><thead><tr><th>${schedState.anchorCourse} Section</th><th>Days</th><th>Time</th><th>Instructor</th><th>Free Options</th><th>Status</th></tr></thead><tbody>`;
  anchorUnique.forEach((a, i) => {
    const freeOpts = matrix[i].filter(v => !v).length;

    html += `<tr><td style="font-weight:600;">Sec ${a.sec} (${a.crn})</td><td>${a.d}</td><td>${a.t}</td><td>${a.ins}</td><td>${freeOpts} of ${compareUnique.length}</td><td>${status}</td></tr>`;

  // --- Calendar (show all anchor sections + all compare sections) ---
  html += buildAllSectionsCalendar(anchorSections, compareSections, analysis);

  return html;
}

// CALENDAR BUILDERS
// ============================================================
const DAY_LABELS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
const DAY_CODES = ['M', 'T', 'W', 'R', 'F'];
const START_HOUR = 7;
const END_HOUR = 22;
const HOUR_HEIGHT = 40;
const TOTAL_HOURS = END_HOUR - START_HOUR;

function yPos(minutes) { return ((minutes - START_HOUR * 60) / 60) * HOUR_HEIGHT; }
function blockHeight(time) { return ((time.end - time.start) / 60) * HOUR_HEIGHT; }
function fmtTime(m) { const h = Math.floor(m/60); const mm = m%60; const hr = h>12?h-12:(h===0?12:h); return `${hr}:${String(mm).padStart(2,'0')}${h>=12?'p':'a'}`; }
function fmtRange(time) { return fmtTime(time.start) + '-' + fmtTime(time.end); }

function buildTimeLabels() {
  let html = '';
  for (let h = START_HOUR; h < END_HOUR; h++) {
    const hr = h > 12 ? h - 12 : (h === 0 ? 12 : h);
    html += `<div class="time-label">${hr}${h>=12?'pm':'am'}</div>`;
  }
  return html;
}

function layoutBlocks(dayBlocks) {
  // Sort and assign columns for side-by-side layout
  dayBlocks.sort((a, b) => a.time.start - b.time.start || a.time.end - b.time.end);
  const columns = [];
  const layout = dayBlocks.map(blk => {
    for (let c = 0; c < columns.length; c++) {
      if (blk.time.start >= columns[c]) { columns[c] = blk.time.end; return { col: c, totalCols: 1 }; }
    }
    columns.push(blk.time.end);
    return { col: columns.length - 1, totalCols: 1 };
  });
  // Normalize totalCols per cluster
  dayBlocks.forEach((blk, i) => {
    let maxCol = layout[i].col;
    dayBlocks.forEach((other, j) => {
      if (i !== j && blk.time.start < other.time.end && other.time.start < blk.time.end)
        maxCol = Math.max(maxCol, layout[j].col);
    });
    layout[i].totalCols = maxCol + 1;
  });
  dayBlocks.forEach((blk, i) => {
    dayBlocks.forEach((other, j) => {
      if (i !== j && blk.time.start < other.time.end && other.time.start < blk.time.end) {
        const shared = Math.max(layout[i].totalCols, layout[j].totalCols);
        layout[i].totalCols = shared; layout[j].totalCols = shared;
      }
    });
  });
  return layout;
}

function renderDayColumn(dayBlocks) {
  let html = '';
  for (let h = 0; h < TOTAL_HOURS; h++) html += `<div class="hour-line" style="top:${h*HOUR_HEIGHT}px"></div>`;
  const layout = layoutBlocks(dayBlocks);
  dayBlocks.forEach((blk, i) => {
    const top = yPos(blk.time.start);
    const height = blockHeight(blk.time);
    const { col, totalCols } = layout[i];
    const w = (100/totalCols).toFixed(1);
    const l = (col*100/totalCols).toFixed(1);
    html += `<div class="cal-block ${blk.cls}" style="top:${top}px;height:${Math.max(height,22)}px;left:${l}%;width:${w}%;right:auto;z-index:${blk.zIndex||1};" title="${blk.tooltip||''}">
      <div class="block-title">${blk.label}</div>
      <div class="block-meta">${blk.meta}</div>
    </div>`;
  });
  return html;
}

function wrapCalendar(title, buildDayFn) {
  const gridHeight = TOTAL_HOURS * HOUR_HEIGHT;
  let html = `<div class="section-panel"><h2>${title}</h2>`;
  html += `<div class="week-grid" style="grid-template-rows:auto ${gridHeight}px;">`;
  html += `<div class="day-header" style="border-right:1px solid var(--border-color);">Time</div>`;
  DAY_LABELS.forEach(d => { html += `<div class="day-header">${d}</div>`; });
  html += `<div class="time-col">${buildTimeLabels()}</div>`;
  DAY_CODES.forEach(code => { html += `<div class="day-col">${renderDayColumn(buildDayFn(code))}</div>`; });
  html += `</div>`;
  html += `<div class="cal-legend">
    <div class="cal-legend-item"><div class="cal-legend-swatch anchor"></div>Anchor sections</div>
    <div class="cal-legend-item"><div class="cal-legend-swatch compare"></div>Available (no overlap)</div>
    <div class="cal-legend-item"><div class="cal-legend-swatch overlap"></div>Overlaps with anchor</div>
  </div></div>`;
  return html;
}

// Calendar for Course vs Course mode (all sections of both courses)
function buildAllSectionsCalendar(anchorSections, compareSections, analysis) {
  const { anchorUnique, compareUnique, matrix } = analysis;

  // Determine which compare sections conflict with ANY anchor section
  const compareConflicts = compareUnique.map((_, j) => matrix.some(row => row[j]));

  return wrapCalendar('Weekly Schedule - All Sections', (dayCode) => {
    const blocks = [];
    // All anchor sections
    anchorSections.forEach(r => {
      if (!r.days.includes(dayCode)) return;
      blocks.push({ time: r.time, cls: 'anchor', zIndex: 10,
        label: `${r.course} (${r.sec})`, meta: `${fmtRange(r.time)} - ${r.ins}`,
        tooltip: `${r.course} Sec ${r.sec} - ${r.ins} - ${r.rm}` });
    });
    // All compare sections
    compareUnique.forEach((sec, j) => {
      const isConflict = compareConflicts[j];
      sec.allMeetings.forEach(meeting => {
        if (!meeting.days.includes(dayCode)) return;
        blocks.push({ time: meeting.time, cls: isConflict ? 'overlap' : 'compare', zIndex: isConflict ? 5 : 1,
          label: `${sec.course} (${sec.sec})`, meta: `${fmtRange(meeting.time)} - ${sec.ins}`,
          tooltip: `${sec.course} Sec ${sec.sec} - ${sec.ins} ${isConflict ? '(conflicts with anchor)' : '(available)'}` });
      });
    });
    return blocks;
  });
}

// Calendar for single-section mode
function buildSingleCalendar(anchorMeetings, analysis) {
  return wrapCalendar(`Weekly Schedule - ${schedState.anchorCourse} Sec ${anchorMeetings[0]?.sec||'?'} vs ${schedState.compareCourse}`, (dayCode) => {
    const blocks = [];
    anchorMeetings.forEach(r => {
      if (!r.days.includes(dayCode)) return;
      blocks.push({ time: r.time, cls: 'anchor', zIndex: 10,
        label: `${r.course} (${r.sec})`, meta: `${fmtRange(r.time)} - ${r.ins}`,
        tooltip: `${r.course} Sec ${r.sec} - ${r.ins}` });
    });
    analysis.analyzed.forEach(sec => {
      sec.allMeetings.forEach(meeting => {
        if (!meeting.days.includes(dayCode)) return;
        blocks.push({ time: meeting.time, cls: sec.overlaps ? 'overlap' : 'compare', zIndex: sec.overlaps ? 5 : 1,
          label: `${sec.course} (${sec.sec})`, meta: `${fmtRange(meeting.time)} - ${sec.ins}`,
          tooltip: `${sec.course} Sec ${sec.sec} - ${sec.ins} ${sec.overlaps ? '(OVERLAPS)' : '(available)'}` });
      });
    });
    return blocks;
  });
}

render();
