AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-09
Description: >
  Schedule-conflict services and chatbot. Three Lambdas behind API Gateway:

  - ConflictFunction (/conflicts, API key required): stateless, takes a list of
    course sections and returns conflicting cross-course section pairs (day +
    time overlap). Called by the pathway-conflict batch script.
  - PlanFunction (/plan, NO API key): term-aware student planner. Given a term
    and canonical course codes, it reads that term's sections from
    deanza-class-schedule itself and returns the overlap/clear split with a
    percentage. Called directly by the browser app, so it is public.
  - ChatFunction (/chat, NO API key): Bedrock chatbot. Reads DynamoDB tables
    on cold start, answers student questions about schedules, pathways, and
    conflicts via Amazon Bedrock Converse API.

  NOTE: a REST API (not HTTP API) is used because API keys + usage plans — the
  auth model for /conflicts — are a REST API feature. /plan and /chat opt out
  per-method with ApiKeyRequired: false.

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256

Parameters:
  BedrockModelId:
    Type: String
    Default: amazon.nova-lite-v1:0
    Description: Bedrock model ID for the chatbot (must support Converse API)

Resources:
  # REST API with an API key required on every call, a usage plan for
  # throttling/quota, and CORS so the browser-based tool can call it.
  ConflictApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          Description: Throttle + quota for the conflict service
          Throttle:
            BurstLimit: 20
            RateLimit: 10
          Quota:
            Limit: 100000
            Period: MONTH
      Cors:
        # Tighten AllowOrigin to the tool's domain before real use.
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,x-api-key'"
        AllowOrigin: "'*'"

  # The conflict-detection function. CodeUri is the whole scripts/ dir so the
  # `conflicts` package sits at the deployment root and its internal
  # `from conflicts...` imports resolve; only the conflicts package is used and
  # it is pure stdlib (no extra dependencies to bundle).
  ConflictFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deanza-schedule-conflicts
      CodeUri: ../scripts
      Handler: conflicts.lambda_handler.handler
      Description: Detect day+time overlaps among a list of course sections
      Events:
        DetectConflicts:
          Type: Api
          Properties:
            RestApiId: !Ref ConflictApi
            Path: /conflicts
            Method: post

  # The student-planner function. Term-aware: it reads deanza-class-schedule
  # itself, so (unlike ConflictFunction) it needs DynamoDB read access. Exposed
  # WITHOUT an API key so the browser app can call it directly — the data is
  # public published-schedule info; the usage plan's throttle still applies.
  PlanFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deanza-schedule-plan
      CodeUri: ../scripts
      Handler: conflicts.plan_handler.handler
      Description: Term-aware planner — resolve a term's sections and classify overlaps
      Environment:
        Variables:
          SCHEDULE_TABLE: deanza-class-schedule
          # Tighten to the app's origin before real use.
          CORS_ALLOW_ORIGIN: "*"
      Policies:
        # Read-only: the planner only queries the schedule table.
        - DynamoDBReadPolicy:
            TableName: deanza-class-schedule
      Events:
        PlanConflicts:
          Type: Api
          Properties:
            RestApiId: !Ref ConflictApi
            Path: /plan
            Method: post
            Auth:
              ApiKeyRequired: false

  # Bedrock chatbot — reads the three DynamoDB tables on cold start, summarizes
  # the data, and answers student questions via Bedrock Converse API. Public
  # endpoint (no API key) since the data is published schedule info.
  ChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deanza-schedule-chatbot
      CodeUri: ../scripts/chatbot
      Handler: index.handler
      Runtime: nodejs22.x
      Timeout: 60
      MemorySize: 1024
      Description: Bedrock chatbot backed by DynamoDB schedule/pathway/conflict data
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          ALLOWED_ORIGIN: "*"
          SCHEDULE_TABLE: deanza-class-schedule
          CONFLICTS_TABLE: deanza-pathway-conflicts
          PATHWAYS_TABLE: deanza-pathways-normalized
      Policies:
        - Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Action:
                - bedrock:InvokeModel
              Resource: "*"
        - DynamoDBReadPolicy:
            TableName: deanza-class-schedule
        - DynamoDBReadPolicy:
            TableName: deanza-pathway-conflicts
        - DynamoDBReadPolicy:
            TableName: deanza-pathways-normalized
      Events:
        ChatPost:
          Type: Api
          Properties:
            RestApiId: !Ref ConflictApi
            Path: /chat
            Method: post
            Auth:
              ApiKeyRequired: false

Outputs:
  ApiEndpoint:
    Description: 'POST here with a JSON body {sections: [...]} and header x-api-key'
    Value: !Sub "https://${ConflictApi}.execute-api.${AWS::Region}.amazonaws.com/prod/conflicts"
  PlanEndpoint:
    Description: 'POST here with {term_code, courses:[...]} — no API key'
    Value: !Sub "https://${ConflictApi}.execute-api.${AWS::Region}.amazonaws.com/prod/plan"
  ApiKeyRetrieval:
    Description: Fetch the generated API key value
    Value: !Sub "aws apigateway get-api-keys --name-query ${AWS::StackName} --include-values --query 'items[0].value' --output text"
  ChatEndpoint:
    Description: 'POST here with {messages:[{role,content}]} — no API key'
    Value: !Sub "https://${ConflictApi}.execute-api.${AWS::Region}.amazonaws.com/prod/chat"
